<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dressing Famille</title>
<meta name="description" content="Inventaire des vêtements de la famille.">
<meta name="theme-color" content="#c9924f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dressing">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Almendra:wght@400;700&family=Baloo+2:wght@600;700;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<style>
img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px)}
/* Layout : une chambre (mur peint + papier à rayures), une étagère en bois comme barre d'onglets,
   et une armoire en chêne dont les portes s'ouvrent sur un portant et des tiroirs à porte-étiquette. */
:root{
  --wall:#dde7e4; --wall-2:#d1dfdb; --paper:#fcfbf6; --paper-2:#f1efe6;
  --ink:#1d2b2a; --muted:#566866; --line:#c3d0cc;
  --wood:#c9924f; --wood-2:#b98040; --wood-dark:#8f6130; --wood-deep:#5e3d1c;
  --inside:#f3e6cc; --inside-2:#e6d4b0; --brass:#d99a1c; --brass-dark:#9c6a08; --metal:#a9b4b6;
  --c-moi:#2c5f8d; --c-nine:#bf3f68; --c-camille:#267d5a; --c-romy:#b5600c; --c-compagne:#77499f;
  --warn:#b23f1c; --warn-bg:#fbe3d8; --ok:#267d5a; --on-color:#ffffff; --shadow:rgba(40,50,48,.18);
  --glow:#e9bf4a; --sky:#c9c2e4; --sky-2:#f2dcc2; --hill:#5f6f66; --hill-2:#3c3a52; --hill-3:#4a5a52; --flake:#ffffff; --crest-ink:#fff6e2; --crest-dark:#2a2433;
  --h-renard:#b5561f; --h2-renard:#3d4856; --h-heron:#1f7f86; --h2-heron:#cbb891; --h-loutre:#2f6b4a; --h2-loutre:#efe6cf; --h-herisson:#7a3d75; --h2-herisson:#c9952b;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --wall:#16222a; --wall-2:#1b2932; --paper:#22323b; --paper-2:#2a3c46;
  --ink:#ecf2f0; --muted:#a3b5b2; --line:#3a4d57;
  --wood:#8d6236; --wood-2:#7d5429; --wood-dark:#5a3b1c; --wood-deep:#38240f;
  --inside:#2b2620; --inside-2:#373027; --brass:#e9b64a; --brass-dark:#a9791a; --metal:#6f7c80;
  --c-moi:#3f7fb8; --c-nine:#d2567f; --c-camille:#2f9a70; --c-romy:#cf7419; --c-compagne:#9365c0;
  --warn:#ff9b78; --warn-bg:#4a261b; --ok:#6fd0a6; --on-color:#ffffff; --shadow:rgba(0,0,0,.45);
  color-scheme:dark } }
:root[data-theme="dark"]{
  --wall:#16222a; --wall-2:#1b2932; --paper:#22323b; --paper-2:#2a3c46;
  --ink:#ecf2f0; --muted:#a3b5b2; --line:#3a4d57;
  --wood:#8d6236; --wood-2:#7d5429; --wood-dark:#5a3b1c; --wood-deep:#38240f;
  --inside:#2b2620; --inside-2:#373027; --brass:#e9b64a; --brass-dark:#a9791a; --metal:#6f7c80;
  --c-moi:#3f7fb8; --c-nine:#d2567f; --c-camille:#2f9a70; --c-romy:#cf7419; --c-compagne:#9365c0;
  --warn:#ff9b78; --warn-bg:#4a261b; --ok:#6fd0a6; --on-color:#ffffff; --shadow:rgba(0,0,0,.45);
  color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--wall);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  background-image:repeating-linear-gradient(90deg,var(--wall) 0 34px,var(--wall-2) 34px 36px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;text-wrap:balance}
svg.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

#app{max-width:780px;margin:0 auto;padding-inline:16px;padding-block:18px 110px;overflow-x:clip}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.top h1{font-size:clamp(1.9rem,6vw,2.6rem);font-weight:800}
.top p{margin:2px 0 0;color:var(--muted)}
.status{font-size:.8rem;font-weight:700;color:var(--muted);background:var(--paper);border:1px solid var(--line);border-radius:99px;padding:4px 11px;display:inline-flex;gap:6px;align-items:center}
.status i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.status.wait i{background:var(--brass)} .status.err i{background:var(--warn)}

/* Boutons 3D */
.b3{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--display);font-weight:700;font-size:1rem;
  padding:10px 16px;border-radius:14px;background:var(--brass);color:#2a1c00;box-shadow:0 5px 0 var(--brass-dark);
  transition:transform .08s,box-shadow .08s;min-height:44px}
.b3:active{transform:translateY(4px);box-shadow:0 1px 0 var(--brass-dark)}
.b3.plain{background:var(--paper);color:var(--ink);box-shadow:0 5px 0 var(--line);border:1px solid var(--line)}
.b3.plain:active{box-shadow:0 1px 0 var(--line)}
.b3.danger{background:var(--warn-bg);color:var(--warn);box-shadow:0 5px 0 var(--warn)}
.b3.danger:active{box-shadow:0 1px 0 var(--warn)}
.b3.small{padding:6px 12px;min-height:36px;font-size:.92rem;border-radius:11px}

/* Accueil : cartes des personnes */
.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:22px 16px}
.person{--c:var(--c-moi);position:relative;background:var(--paper);border-radius:24px;box-shadow:0 8px 0 var(--c),0 16px 22px var(--shadow);
  transition:transform .09s,box-shadow .09s}
.person:has(.open-btn:active){transform:translateY(6px);box-shadow:0 2px 0 var(--c),0 6px 10px var(--shadow)}
.open-btn{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;width:100%;padding:16px 56px 16px 16px;border-radius:24px}
.medal{width:78px;height:78px;border-radius:50%;background:var(--c);color:var(--on-color);display:flex;align-items:flex-end;justify-content:center;overflow:hidden;
  box-shadow:inset 0 -6px 0 rgba(0,0,0,.18),inset 0 4px 0 rgba(255,255,255,.22)}
.medal svg{width:66px;height:66px;fill:currentColor;transform-origin:50% 100%}
.person h2{font-size:1.55rem;font-weight:800;min-width:0;overflow-wrap:anywhere}
.rows{display:grid;gap:3px;margin-top:6px;font-size:.93rem}
.rows div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding-bottom:2px}
.rows span{color:var(--muted)} .rows b{font-variant-numeric:tabular-nums}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.pill{font-size:.78rem;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--paper-2);color:var(--ink);white-space:nowrap}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.edit-btn{position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:12px;background:var(--paper-2);display:grid;place-items:center;box-shadow:0 3px 0 var(--line)}
.edit-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.person.todo{background:transparent;box-shadow:none;border:3px dashed var(--c)}
.person.todo .open-btn{padding-right:16px}
.person.todo .medal{opacity:.75}
.hint{color:var(--muted);font-size:.9rem;margin:22px 0 0}

.season{display:flex;gap:10px;margin-bottom:18px}
.season button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:9px 8px;border-radius:14px;background:var(--paper);border:1px solid var(--line);box-shadow:0 4px 0 var(--line);font-family:var(--display);font-weight:700;font-size:.98rem;min-height:46px;line-height:1.1}
.season button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.season button[aria-pressed="true"]{background:var(--brass);color:#2a1c00;border-color:var(--brass-dark);box-shadow:0 4px 0 var(--brass-dark)}
.drawer-inside.reserve{grid-template-columns:1fr}
.res{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--paper);border-radius:12px;padding:10px 12px}
.res>div:first-child{min-width:0;flex:1 1 130px}
.res small{display:block;color:var(--muted)}
.res-b{display:flex;gap:8px;flex-wrap:wrap}
.reserve .note{margin:0}

/* Armoire */
.arm-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.arm-head h1{font-size:clamp(1.5rem,5vw,2rem);font-weight:800;min-width:0;overflow-wrap:anywhere}
.arm-head .sub{color:var(--muted);font-size:.9rem}
.back{width:46px;height:46px;border-radius:14px;background:var(--paper);display:grid;place-items:center;box-shadow:0 4px 0 var(--line);flex:none;border:1px solid var(--line)}
.back:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
details.needs{background:var(--warn-bg);color:var(--warn);border-radius:16px;padding:10px 14px;margin-bottom:14px}
details.needs summary{font-weight:700;cursor:pointer}
.needs ul{list-style:none;margin:8px 0 2px;padding:0;display:grid;gap:6px}
.needs li button{width:100%;display:flex;justify-content:space-between;gap:10px;background:var(--paper);color:var(--ink);border-radius:10px;padding:7px 10px;font-size:.92rem}
.needs li small{color:var(--muted);white-space:nowrap}

.armoire{--c:var(--c-moi);position:relative;perspective:1500px}
.cornice{height:22px;margin-inline:-6px;border-radius:12px 12px 4px 4px;background:var(--wood-dark);box-shadow:inset 0 -5px 0 var(--wood-deep)}
.cabinet{position:relative;background:var(--wood);border:10px solid var(--wood-dark);border-top-width:8px;border-radius:0 0 10px 10px;
  background-image:repeating-linear-gradient(90deg,transparent 0 26px,var(--wood-2) 26px 27px)}
.feet{display:flex;justify-content:space-between;padding-inline:18px}
.feet i{width:26px;height:14px;background:var(--wood-deep);border-radius:0 0 8px 8px}
.door{position:absolute;top:0;bottom:0;width:50%;z-index:5;background:var(--wood);border:6px solid var(--wood-dark);
  background-image:repeating-linear-gradient(90deg,transparent 0 26px,var(--wood-2) 26px 27px);
  transition:transform 1s cubic-bezier(.55,.05,.2,1),opacity .35s .75s,visibility 0s 1.1s}
.door::before{content:"";position:absolute;inset:14px;border:3px solid var(--wood-dark);border-radius:6px;opacity:.6}
.door::after{content:"";position:absolute;top:min(180px,40%);width:16px;height:16px;border-radius:50%;background:var(--brass);box-shadow:0 3px 0 var(--brass-dark)}
.door.l{left:0;transform-origin:left center}.door.l::after{right:12px}
.door.r{right:0;transform-origin:right center}.door.r::after{left:12px}
.armoire.open .door{opacity:0;visibility:hidden;pointer-events:none}
.armoire.open .door.l{transform:rotateY(-105deg)}
.armoire.open .door.r{transform:rotateY(105deg)}
.armoire.still .door{display:none}

.rail-zone{background:var(--inside);padding:0 12px 16px;background-image:linear-gradient(var(--inside-2),var(--inside) 60px)}
.zone-title{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 2px 8px;font-family:var(--display);font-weight:700;color:var(--muted)}
.bar{height:9px;border-radius:9px;background:var(--metal);box-shadow:inset 0 -3px 0 rgba(0,0,0,.2);margin-inline:-4px}
.hangers{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:4px 10px}
.hang{display:flex;flex-direction:column;align-items:center;width:100%;color:var(--muted)}
.hang svg{width:34px;height:30px;margin-top:-4px}
.hang .tag{width:100%;background:var(--paper);color:var(--ink);border-radius:6px 6px 14px 14px;padding:8px 6px 9px;text-align:center;box-shadow:0 4px 0 var(--c);
  font-weight:700;font-size:.86rem;line-height:1.15;min-height:74px;display:flex;flex-direction:column;justify-content:space-between;gap:4px;overflow-wrap:anywhere}
.hang:active .tag{transform:translateY(3px);box-shadow:0 1px 0 var(--c)}
.hang.add .tag{background:transparent;border:2px dashed var(--muted);box-shadow:none;color:var(--muted);justify-content:center;align-items:center}
.num{font-family:var(--display);font-weight:800;font-size:1.15rem;font-variant-numeric:tabular-nums;line-height:1}
.low{color:var(--warn)}

.drawers{display:grid;gap:8px;padding:10px 8px;background:var(--wood-dark)}
.drawer-front{width:100%;display:grid;grid-template-columns:minmax(0,auto) 1fr auto;align-items:center;gap:10px;padding:12px;border-radius:8px;background:var(--wood);
  background-image:repeating-linear-gradient(90deg,transparent 0 26px,var(--wood-2) 26px 27px);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.22),inset 0 -4px 0 rgba(0,0,0,.18),0 3px 0 var(--wood-deep);transition:transform .15s,box-shadow .15s}
.drawer.open .drawer-front{transform:translateY(5px) scale(1.012);box-shadow:inset 0 2px 0 rgba(255,255,255,.22),inset 0 -4px 0 rgba(0,0,0,.18),0 10px 14px var(--shadow)}
.plate{justify-self:start;display:inline-flex;align-items:center;gap:8px;background:var(--paper);color:var(--ink);border:3px solid var(--brass);border-radius:6px;padding:4px 10px;
  font-family:var(--display);font-weight:700;font-size:1rem;line-height:1.15;min-width:0}
.knob{justify-self:center;width:22px;height:22px;border-radius:50%;background:var(--brass);box-shadow:0 4px 0 var(--brass-dark),inset 0 3px 0 rgba(255,255,255,.4)}
.cnt{justify-self:end;display:inline-flex;gap:6px;align-items:center;background:var(--wood-deep);color:#fff3df;border-radius:99px;padding:3px 11px;font-weight:700;font-size:.85rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.cnt .dot{width:9px;height:9px;border-radius:50%;background:#ff8a5c}
.drawer-inside{background:var(--inside);margin:0 6px;padding:14px 10px 12px;border-radius:0 0 10px 10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;animation:slide .22s ease-out}
@keyframes slide{from{opacity:.4;transform:translateY(-10px)}to{opacity:1;transform:none}}
.cat{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--paper);border-radius:12px;padding:10px 12px;box-shadow:0 4px 0 var(--c);font-weight:700;font-size:.92rem;line-height:1.2;min-height:52px;overflow-wrap:anywhere}
.cat:active{transform:translateY(3px);box-shadow:0 1px 0 var(--c)}
.cat.add{background:transparent;border:2px dashed var(--muted);box-shadow:none;color:var(--muted);justify-content:center}

/* Feuilles et fenêtres */
.veil{position:fixed;inset:0;background:rgba(10,18,20,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.panel{--c:var(--c-moi);background:var(--paper);color:var(--ink);width:100%;max-width:580px;max-height:92%;overflow:auto;border-radius:24px 24px 0 0;
  padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));border-top:8px solid var(--c)}
#modal .panel,.panel.anim{animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
@media (min-width:640px){.veil{align-items:center}.panel{border-radius:24px}}
.panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
.panel-head h2{font-size:1.5rem;font-weight:800;min-width:0;overflow-wrap:anywhere}
.panel-head p{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.x{width:42px;height:42px;border-radius:12px;background:var(--paper-2);display:grid;place-items:center;flex:none}
.seg{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.chip{padding:7px 13px;border-radius:99px;background:var(--paper-2);font-weight:700;font-size:.9rem;border:2px solid transparent;min-height:38px}
.chip[aria-pressed="true"]{background:var(--c);color:var(--on-color)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:14px 10px;margin-bottom:16px}
.tw{position:relative}
.tile{width:100%;aspect-ratio:1/1;border-radius:18px;background:var(--paper-2);box-shadow:0 6px 0 var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  transition:transform .07s,box-shadow .07s;text-align:center;padding:6px}
.tile:active{transform:translateY(5px);box-shadow:0 1px 0 var(--line)}
.tile .sz{font-family:var(--display);font-weight:700;font-size:1.05rem;line-height:1.05}
.tile .n{font-family:var(--display);font-weight:800;font-size:1.9rem;line-height:1;font-variant-numeric:tabular-nums;color:var(--muted)}
.tile.has{background:var(--c);color:var(--on-color);box-shadow:0 6px 0 rgba(0,0,0,.28),0 6px 0 var(--c)}
.tile.has:active{box-shadow:0 1px 0 rgba(0,0,0,.28),0 1px 0 var(--c)}
.tile.has .n{color:var(--on-color)}
.tile.cur{outline:3px dashed var(--brass);outline-offset:3px}
.tile.pop .n{animation:pop .25s}
@keyframes pop{50%{transform:scale(1.45)}}
.minus{position:absolute;right:-5px;top:-7px;width:34px;height:34px;border-radius:50%;background:var(--paper);border:2px solid var(--line);display:grid;place-items:center;box-shadow:0 3px 0 var(--line)}
.minus:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.minus[disabled]{visibility:hidden}
.minus svg{width:16px;height:16px;stroke-width:3}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:12px}
.stepper{display:inline-flex;align-items:center;gap:8px;font-weight:700}
.stepper button{width:36px;height:36px;border-radius:10px;background:var(--paper-2);display:grid;place-items:center;box-shadow:0 3px 0 var(--line)}
.stepper output{min-width:2ch;text-align:center;font-family:var(--display);font-size:1.2rem;font-variant-numeric:tabular-nums}
.note{color:var(--muted);font-size:.85rem;margin:6px 0 0}

form.grid{display:grid;gap:12px}
.f2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
label.f{display:grid;gap:4px;font-weight:700;font-size:.9rem;min-width:0}
.f input,.f select{width:100%;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--paper-2);min-height:44px;font-weight:600}
fieldset{border:1px dashed var(--line);border-radius:14px;padding:10px 12px 12px;margin:0;min-width:0}
legend{font-weight:700;font-size:.9rem;padding:0 6px;color:var(--muted)}
.err{color:var(--warn);font-weight:700;font-size:.9rem;margin:0}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;margin-top:6px}
.sugg{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}

/* Pages Conseils et Réglages */
.sheet-page{display:grid;gap:14px}
.box{background:var(--paper);border-radius:20px;padding:16px;box-shadow:0 5px 0 var(--line)}
.box h2{font-size:1.25rem;font-weight:700;margin-bottom:6px;display:flex;gap:10px;align-items:center}
.box h2 svg{color:var(--brass-dark)}
.box p,.box li{max-width:65ch}
.box p{margin:6px 0}
.box ul{margin:6px 0;padding-left:1.15em;display:grid;gap:5px}
table.rep{border-collapse:collapse;width:100%;max-width:420px;margin-top:6px;font-variant-numeric:tabular-nums}
.rep td{padding:5px 4px;border-bottom:1px dashed var(--line)} .rep td:last-child{text-align:right;font-weight:700}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 0;border-bottom:1px dashed var(--line)}
.row:last-child{border-bottom:0}
.row>div{min-width:0;flex:1 1 200px}
.row small{color:var(--muted);display:block}
.switch{appearance:none;width:54px;height:30px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--paper);box-shadow:0 2px 0 rgba(0,0,0,.2);transition:left .15s}
.switch:checked{background:var(--ok)} .switch:checked::after{left:27px}
textarea.recap{width:100%;min-height:180px;border-radius:12px;border:2px solid var(--line);background:var(--paper-2);padding:10px;font-size:.85rem;margin-top:10px}

/* Barre d'onglets : une étagère en bois */

  else if(!dbReady){cls=' wait';txt='Chargement…';}

function flush(id){

  if(busy[id]){busy[id]=2;return;}
  busy[id]=1;
  db.doc('dressing/'+id).set(body(id)).then(function(){failed=false;},function(){failed=true;}).then(function(){
    var again=busy[id]===2; busy[id]=0;
    if(again){flush(id);return;}
    dirty[id]=false; paintStatus();
  });
}
function applyRemote(snap){var changed=false;
  snap.docs.forEach(function(d){ if(dirty[d.id])return; var data=d.data(); if(!data)return; data=clone(data);
    if(d.id==='reglages'){var s=Object.assign(DEFSET(),data); if(JSON.stringify(s)!==JSON.stringify(state.settings)){state.settings=s;changed=true;}}
    else if(PEOPLE[d.id]){var p=normalize(d.id,data); if(JSON.stringify(p)!==JSON.stringify(state.profiles[d.id])){state.profiles[d.id]=p;changed=true;}}
  });

}
function startDb(){

    if(!db)return;
    db.collection('dressing').onSnapshot(applyRemote,function(){failed=true;paintStatus();});

/* ---------- Actions ---------- */
function bump(pid,cid,size,delta){var p=state.profiles[pid]; if(!C(p)[cid])C(p)[cid]={};
  var v=Math.max(0,(C(p)[cid][size]||0)+delta); if(v)C(p)[cid][size]=v; else delete C(p)[cid][size];
  if(!Object.keys(C(p)[cid]).length)delete C(p)[cid];}
function give(size){var from=ui.pid,to=ui.to,p=state.profiles[from],cat=findCat(from,ui.sheet);
  if(!((C(p)[cat.id]||{})[size]>0)){toast('Aucun vêtement en '+lab(size)+' à transmettre.');return;}
  var dest=state.profiles[to];
  if(!findCat(to,cat.id))dest.custom.push({id:cat.id,label:cat.label,drawer:cat.drawer,kind:cat.kind,min:0});
  bump(from,cat.id,size,-1);bump(to,cat.id,size,1);save(from);save(to);
  toast(cat.label+' '+lab(size)+' : 1 pièce transmise à '+dest.name+'.');}
function ensureCat(pid,a){ if(!findCat(pid,a.cat))state.profiles[pid].custom.push({id:a.cat,label:a.label,drawer:a.drawer,kind:a.kind,min:0}); }
function setAside(size){var from=ui.pid,to=ui.to,p=state.profiles[from],cat=findCat(from,ui.sheet),dest=state.profiles[to],z=S();
  if(!((C(p)[cat.id]||{})[size]>0)){toast('Aucun vêtement en '+lab(size)+' à mettre de côté.');return;}
  var a=dest.aside.filter(function(x){return x.from===from&&x.cat===cat.id&&x.size===size&&x.season===z;})[0];
  if(a)a.n++; else dest.aside.push({from:from,cat:cat.id,label:cat.label,drawer:cat.drawer,kind:cat.kind,size:size,season:z,n:1});
  bump(from,cat.id,size,-1);save(from);save(to);
  toast(cat.label+' '+lab(size)+' : 1 pièce mise de côté pour '+dest.name+'.');}
function takeAside(i,back){var pid=ui.pid,p=state.profiles[pid],a=p.aside[i]; if(!a||a.n<1)return;
  var target=back?a.from:pid; ensureCat(target,a); bump(target,a.cat,a.size,1);
  a.n--; if(a.n<1)p.aside.splice(i,1);
  save(pid); if(back)save(a.from);
  toast(a.label+' '+lab(a.size)+' : 1 pièce '+(back?'rendue à '+state.profiles[a.from].name:'rangée dans l\'armoire de '+p.name)+'.');render();}
function closeModal(){modalEl.innerHTML='';}
function addCat(pid,c){state.profiles[pid].custom.push(c);save(pid);ui.drawer=c.drawer==='rail'?ui.drawer:c.drawer;closeModal();render();toast('Catégorie « '+c.label+' » ajoutée.');}

document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]'); if(!b)return;
  var act=b.dataset.act,pid=ui.pid,p=pid&&state.profiles[pid];
  if(act==='closesheet'){ if(b.classList.contains('veil')&&e.target!==b)return; ui.sheet=null;ui.mode='add';renderSheet();render();return; }
  if(act==='tab'){ui.view=b.dataset.v;ui.recap='';render();window.scrollTo(0,0);return;}
  if(act==='home'){ui.view='accueil';render();return;}
  if(act==='open'){ui.pid=b.dataset.p;ui.view='armoire';ui.drawer=null;ui.doors=false;render();window.scrollTo(0,0);return;}
  if(act==='edit'){modalEl.innerHTML=profileForm(b.dataset.p);var f=document.getElementById('pf-name');if(f)f.focus();return;}
  if(act==='closemodal'){closeModal();return;}
  if(act==='done'){p.done[S()]=true;save(pid);render();toast('Les catégories vides sont maintenant signalées.');return;}
  if(act==='drawer'){ui.drawer=ui.drawer===b.dataset.d?null:b.dataset.d;render();return;}
  if(act==='cat'){ui.sheet=b.dataset.c;ui.mode='add';ui.fresh=true;renderSheet();return;}
  if(act==='addcat'){modalEl.innerHTML=catForm(pid,b.dataset.d);return;}
  if(act==='sugg'){var d=CAT[b.dataset.c];addCat(pid,{id:b.dataset.c,label:d[0],drawer:d[1],kind:d[2],min:d[3]});return;}
  if(act==='mode'){ui.mode=b.dataset.m;renderSheet();return;}
  if(act==='look'){state.settings.look=b.dataset.l;save('reglages');render();return;}
  if(act==='to'){ui.to=b.dataset.p;renderSheet();return;}
  if(act==='season'){ if(state.settings.season!==b.dataset.z){state.settings.season=b.dataset.z;save('reglages');render();renderSheet();toast('Dressing '+SEASON[S()].toLowerCase()+' affiché.');} return;}
  if(act==='store'){takeAside(+b.dataset.i,false);return;}
  if(act==='giveback'){takeAside(+b.dataset.i,true);return;}
  if(act==='tile'){var s=b.dataset.s; if(ui.mode==='give')give(s); else if(ui.mode==='aside')setAside(s); else {bump(pid,ui.sheet,s,1);save(pid);} renderSheet(s);return;}
  if(act==='minus'){bump(pid,ui.sheet,b.dataset.s,-1);save(pid);renderSheet();return;}
  if(act==='min'){var cat=findCat(pid,ui.sheet);p.mins[S()][cat.id]=Math.max(0,Math.min(30,minOf(p,cat)+parseInt(b.dataset.v,10)));save(pid);renderSheet();return;}
  if(act==='delcat'){var c=findCat(pid,ui.sheet);modalEl.innerHTML=confirmBox('Supprimer « '+c.label+' » ?','La catégorie et les '+catTotal(p,c.id)+' pièces comptées dedans seront retirées de cette armoire.','Supprimer','dodelcat');return;}
  if(act==='dodelcat'){var id=ui.sheet;p.custom=p.custom.filter(function(x){return x.id!==id;});delete p.inv.ah[id];delete p.inv.pe[id];delete p.mins.ah[id];delete p.mins.pe[id];save(pid);ui.sheet=null;closeModal();renderSheet();render();return;}
  if(act==='askreset'){var rp=document.getElementById('reset-p').value;modalEl.innerHTML=confirmBox('Vider l\'armoire de '+state.profiles[rp].name+' ?','Les '+profTotal(rp)+' vêtements comptés en '+SEASON[S()].toLowerCase()+' seront effacés. Cette action ne peut pas être annulée.','Vider l\'armoire','doreset',' data-p="'+rp+'"');return;}
  if(act==='doreset'){var q=state.profiles[b.dataset.p];q.inv[S()]={};q.done[S()]=false;save(b.dataset.p);closeModal();render();toast('Armoire de '+q.name+' vidée.');return;}
  if(act==='backup'){var bk=JSON.stringify(state),ta0=document.getElementById('restore-text');
    var ok0=function(){toast('Sauvegarde copiée.');},ko0=function(){ta0.value=bk;ta0.focus();ta0.select();toast('Sélectionne le texte pour le copier.');};
    try{navigator.clipboard.writeText(bk).then(ok0,ko0);}catch(err){ko0();}
    return;}
  if(act==='askrestore'){var er0=document.getElementById('restore-err'),parsed=null;
    try{parsed=JSON.parse(document.getElementById('restore-text').value);}catch(err){}
    if(!parsed||typeof parsed.profiles!=='object'||!parsed.profiles){er0.textContent='Ce texte n\'est pas une sauvegarde valide. Colle le texte complet copié avec « Copier la sauvegarde ».';er0.hidden=false;return;}
    ui.pending=parsed;modalEl.innerHTML=confirmBox('Restaurer cette sauvegarde ?','L\'inventaire actuel de toutes les armoires sera remplacé par celui de la sauvegarde.','Restaurer','dorestore');return;}
  if(act==='dorestore'){var bkp=ui.pending;ui.pending=null; if(!bkp){closeModal();return;}
    state.settings=Object.assign(DEFSET(),bkp.settings||{});
    Object.keys(PEOPLE).forEach(function(k){state.profiles[k]=normalize(k,bkp.profiles[k]);dirty[k]=true;});dirty.reglages=true;
    cache();Object.keys(dirty).forEach(flush);closeModal();render();toast('Sauvegarde restaurée.');return;}
  if(act==='recap'){var txt=buildRecap()||'Aucun profil créé.';ui.recap=txt;render();
    var done=function(){toast('Récapitulatif copié.');},fall=function(){var ta=document.getElementById('recap-text');if(ta){ta.focus();ta.select();}toast('Sélectionne le texte pour le copier.');};
    try{navigator.clipboard.writeText(txt).then(done,fall);}catch(err){fall();}
    return;}
});
document.addEventListener('change',function(e){
  if(e.target.id==='set-compagne'){state.settings.compagne=e.target.checked;save('reglages');render();}
  if(e.target.id==='set-alerts'){state.settings.alerts=e.target.checked;save('reglages');render();}
});
document.addEventListener('submit',function(e){
  e.preventDefault();var f=e.target,val=function(id){var el=document.getElementById(id);return el?el.value.trim():'';};
  if(f.id==='f-profil'){var pid=f.dataset.p,p=state.profiles[pid],err=document.getElementById('pf-err'),name=val('pf-name');
    var h=val('pf-height'),sh=val('pf-shoe');
    var bad=!name?'Indique un prénom.':(h&&(+h<50||+h>230))?'La taille doit être comprise entre 50 et 230 cm.':(sh&&(+sh<18||+sh>50))?'La pointure doit être comprise entre 18 et 50.':'';
    if(bad){err.textContent=bad;err.hidden=false;return;}
    var v=[val('pf-v0'),val('pf-v1')].sort(function(a,b){return VET.indexOf(a)-VET.indexOf(b);});
    var pr=[+val('pf-p0').slice(1),+val('pf-p1').slice(1)].sort(function(a,b){return a-b;});
    p.name=name;p.height=h?String(Math.round(+h)):'';p.shoe=sh?String(Math.round(+sh)):'';p.cur=val('pf-cur');p.vr=v;p.pr=pr;
    if(PEOPLE[pid].adult){p.curPant=val('pf-curpant');p.nr=[+val('pf-n0').slice(1),+val('pf-n1').slice(1)].sort(function(a,b){return a-b;});}
    var hs=document.getElementById('pf-house'); if(hs)p.house=hs.value;
    var dn=document.getElementById('pf-done'); if(dn)p.done[S()]=dn.checked;
    var first=!p.created;p.created=true;save(pid);closeModal();render();renderSheet();toast(first?'Profil de '+name+' créé.':'Profil enregistré.');}
  if(f.id==='f-cat'){var n=val('cf-name'),er=document.getElementById('cf-err');
    if(!n){er.textContent='Donne un nom à la catégorie, ou choisis-en une dans la liste.';er.hidden=false;return;}
    if(catsFor(ui.pid).some(function(c){return c.label.toLowerCase()===n.toLowerCase();})){er.textContent='Cette catégorie existe déjà dans cette armoire.';er.hidden=false;return;}
    addCat(ui.pid,{id:'x'+Date.now().toString(36),label:n,drawer:val('cf-drawer'),kind:val('cf-kind'),min:0});}
});
document.addEventListener('keydown',function(e){ if(e.key!=='Escape')return;
  if(modalEl.innerHTML){closeModal();} else if(ui.sheet){ui.sheet=null;renderSheet();render();}});

var h0=(location.hash||'').slice(1); if(h0==='conseils'||h0==='reglages')ui.view=h0;
render();
startDb();
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(function(){});}
})();
</script>
